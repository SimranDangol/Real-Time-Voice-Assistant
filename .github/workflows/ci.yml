name: CI

on:
  push:
    branches: [main, feat/*, barge-in-tools, llm-tts-pipeline]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server unit tests
        run: pnpm --dir apps/server test

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:pass@localhost:5432/voiceassistant?schema=public
        run: pnpm --dir apps/server exec prisma validate --schema prisma/schema.prisma

      - name: Typecheck backend & frontend
        run: |
          pnpm --dir packages/shared typecheck
          pnpm --dir apps/server typecheck
          pnpm --dir apps/web typecheck
          pnpm --dir eval exec tsc --noEmit

      - name: Build server
        run: pnpm --dir apps/server build

      - name: Validate evaluation scripts
        run: |
          pnpm --dir eval wer
          pnpm --dir eval exec tsx latency-report.ts --log fixtures/latency-smoke.jsonl

      - name: Build Docker image
        run: docker build --tag real-time-voice-assistant:ci .
